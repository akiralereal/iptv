<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>红果短剧 · IPTV</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="../player-assets/hls.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
<header>
  <h1><a class="brand" href="./"><span class="mark" aria-hidden="true">▷</span>红果短剧</a></h1>
  <div class="account">
    <a class="admin-back" href="../{{ADMIN_PATH}}#vod-sources">返回点播源</a>
    <span id="connection">未登录红果</span>
    <button id="open-playback-catalog">点播目录</button>
    <button id="login">登录账号</button>
  </div>
</header>
<main>
  <section class="intro">
    <form id="search-form">
      <label for="query">搜索剧名或演员</label>
      <div class="searchbox">
        <input id="query" name="query" type="search" maxlength="80" required>
        <button type="submit">搜索</button>
      </div>
    </form>
  </section>

  <div id="notice" class="notice" hidden role="status"></div>
  <section id="viewer" hidden>
    <div class="viewer-heading">
      <h2 id="detail-title"></h2>
      <button id="close-viewer" class="quiet">收起 ↑</button>
    </div>
    <div class="theater">
      <div class="screen" id="screen">
        <video id="video" tabindex="0" aria-label="短剧画面" playsinline preload="metadata"></video>
        <video id="standby" hidden muted playsinline preload="auto" tabindex="-1" aria-hidden="true"></video>
        <div id="screen-empty"><span aria-hidden="true">▷</span><p>选择一集，开始观看</p></div>
        <div class="play-controls">
          <input id="timeline" type="range" min="0" max="1" step="0.1" value="0" disabled aria-label="全片播放进度">
          <div class="control-row">
            <button id="play-toggle" aria-label="播放或暂停">播放</button>
            <span id="play-time">0:00 / 0:00</span>
            <button id="mute">静音</button>
            <button id="fullscreen">全屏</button>
          </div>
        </div>
        <p id="play-status" role="status"></p>
        <div class="continuation">
          <label><input id="auto-next" type="checkbox" checked> 自动连播</label>
          <button id="retry-hd" hidden>重试高清</button>
          <span id="next-status" role="status"></span>
        </div>
        <div class="transport">
          <button id="previous" disabled>← 上一集</button>
          <span id="playing-label">尚未选择</span>
          <button id="next" disabled>下一集 →</button>
        </div>
      </div>
      <aside>
        <div class="detail-summary">
          <img id="detail-cover" alt="">
          <div>
            <p id="detail-meta"></p>
            <a id="official" target="_blank" rel="noopener noreferrer">在官网打开 ↗</a>
          </div>
        </div>
        <p id="detail-intro"></p>
        <div class="detail-actions">
          <button id="start-play" hidden>播放第 1 集</button>
          <button id="resume-play" hidden></button>
          <button id="liked-play" hidden></button>
          <button id="publish-series" disabled>加入点播目录</button>
        </div>
        <p id="catalog-publish-status" class="scope-note" role="status"></p>
        <div class="account-actions">
          <button id="favorite-toggle" disabled>收藏这部剧</button>
          <button id="like-toggle" disabled>喜欢这一集</button>
          <button id="refresh-actions" class="quiet">刷新账号状态</button>
        </div>
        <p id="account-action-status" role="status"></p>
        <label class="progress-option"><input id="sync-progress" type="checkbox" checked> 同步观看进度到账号</label>
        <p id="progress-status" role="status"></p>
        <button id="retry-progress" hidden>重试进度同步</button>
        <div class="episode-heading"><h3>选择集数</h3><span id="episode-count"></span></div>
        <div id="episode-ranges" class="ranges"></div>
        <div id="episodes"></div>
      </aside>
    </div>
  </section>

  <section class="catalog">
    <div class="catalog-heading">
      <h2 id="catalog-title">此刻热播</h2>
      <button id="back-home" hidden class="quiet">返回推荐</button>
    </div>
    <nav id="library-nav" aria-label="内容导航">
      <button data-view="catalog" class="active">片库</button>
      <button data-view="favorites">我的收藏</button>
      <button data-view="likes">我的喜欢</button>
      <button data-view="history">观看历史</button>
    </nav>
    <p id="cloud-status" role="status">登录后自动同步账号数据</p>
    <div id="categories" aria-label="短剧分类">
      <div id="catalog-content-type" class="filter-row" role="group" aria-labelledby="catalog-content-type-label">
        <span id="catalog-content-type-label" class="filter-label">内容类型</span>
        <div class="filter-options">
          <button type="button" data-content-type="" class="active" aria-pressed="true">不限</button>
          <button type="button" data-content-type="real-drama" aria-pressed="false">真人剧</button>
        </div>
      </div>
      <div id="catalog-topics"></div>
    </div>
    <div id="filters" aria-label="筛选条件"></div>
    <p id="catalog-meta"></p>
    <div id="cards" aria-live="polite"><p class="loading">正在读取片库…</p></div>
    <div class="load-more">
      <button id="load-more" hidden>加载更多</button>
      <span id="load-more-status" role="status"></span>
    </div>
  </section>

  <dialog id="account-dialog">
    <div class="dialog-heading">
      <h2>登录账号</h2>
      <button id="close-account" aria-label="关闭登录">×</button>
    </div>
    <p id="account-message">正在读取账号状态…</p>
    <img id="account-qr" alt="官方账号登录二维码" hidden>
    <button id="refresh-qr" hidden>刷新二维码</button>
    <button id="disconnect-account" hidden>退出本模块账号</button>
  </dialog>

  <dialog id="playback-catalog-dialog">
    <div class="dialog-heading">
      <h2>点播目录</h2>
      <button id="close-playback-catalog" aria-label="关闭点播目录">×</button>
    </div>
    <p>在播放器中添加 Emby 服务器，填写以下连接信息。</p>
    <div class="catalog-connection">
      <label for="emby-server">服务器地址</label>
      <input id="emby-server" type="url" readonly spellcheck="false">
      <button id="copy-emby-server" disabled aria-label="复制服务器地址">复制</button>
      <label for="emby-user">用户名</label>
      <input id="emby-user" readonly spellcheck="false">
      <button id="copy-emby-user" disabled aria-label="复制用户名">复制</button>
      <label for="emby-password">播放密码</label>
      <input id="emby-password" type="password" readonly autocomplete="off">
      <button id="copy-emby-password" disabled aria-label="复制播放密码">复制</button>
    </div>
    <button id="rotate-playback-catalog" disabled>重置播放凭据</button>
    <p id="playback-catalog-status" role="status"></p>
    <ul id="catalog-published-series"></ul>
  </dialog>
</main>
<footer>内容来自红果官方服务，版权归各权利人所有。</footer>
</body>
</html>
