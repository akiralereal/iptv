name: push_docker
on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:
env:
  IMAGE: akiralereal/iptv
jobs:
  # 每个平台单独一个 job 并行构建，只按 digest 推送（不打标签），全部成功后由 merge 合成多架构清单再打标签。
  # arm64 放原生 arm runner：以前在 amd64 上走 QEMU 模拟时，arm64 的 npm ci 时常无输出卡死（历次取消重跑都卡在这一步）。
  # arm/v7、arm/v6 仍在 amd64 上走 QEMU：GitHub 的 arm64 机器不保证能原生跑 32 位，这两个平台也从没卡过。
  build:
    name: build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64/v8
            runner: ubuntu-24.04-arm
          - platform: linux/arm/v7
            runner: ubuntu-latest
            qemu: true
          - platform: linux/arm/v6
            runner: ubuntu-latest
            qemu: true
    runs-on: ${{ matrix.runner }}
    # 单平台正常 1~3 分钟；卡住到点即失败，在 Actions 页点「Re-run failed jobs」只重跑失败的平台
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # 不配构建缓存：每次发版 package.json 版本号都变，npm ci 及之后各层必然重建，
      # 原先的 registry 缓存实际只命中 WORKDIR，反而每次多花 ~25 秒导出
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true
  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Create manifest list and push tags
        working-directory: ${{ runner.temp }}/digests
        # 下面的版本标签由 bump-version.js 改写（每种只改文件里第一处），保持一行一个
        env:
          TAGS: |
            akiralereal/iptv:latest
            akiralereal/iptv:4.23.0
            akiralereal/iptv:4.23
            akiralereal/iptv:4
        run: |
          docker buildx imagetools create \
            $(printf -- '-t %s ' $TAGS) \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:latest
