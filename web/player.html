<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 网页直接播放海外直链时不带本页地址做来源头：NASA+ 等 CDN 放行不带来源的请求、拒绝别家来源
         （外部播放器本来就不带）。服务端不读 Referer，本页自己的接口不受影响。 -->
    <meta name="referrer" content="no-referrer">
    <title>播放器 - IPTV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow: hidden;
        }
        
        .player-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .player-header {
            background: #2a2a2a;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            z-index: 1000;
        }
        
        .channel-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .channel-name {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }
        
        .channel-url {
            font-size: 12px;
            color: #999;
            font-family: monospace;
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .close-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .close-btn:hover {
            background: #5568d3;
            transform: translateY(-1px);
        }
        
        .player-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #000;
        }
        
        #dplayer {
            width: 100%;
            height: 100%;
            max-width: 1920px;
            max-height: 1080px;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error-message {
            display: none;
            background: #ff4444;
            color: white;
            padding: 15px 20px;
            margin: 20px;
            border-radius: 6px;
            text-align: center;
        }
        
        .error-message.show {
            display: block;
        }
        
        @media (max-width: 768px) {
            .channel-url {
                display: none;
            }
            
            .player-header {
                padding: 12px 15px;
            }
            
            .channel-name {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="player-header">
            <div class="channel-info">
                <div class="channel-name" id="channelName">正在加载...</div>
                <div class="channel-url" id="channelUrl"></div>
            </div>
            <button class="close-btn" onclick="closePlayer()">关闭播放器</button>
        </div>
        
        <div class="player-wrapper">
            <div id="dplayer"></div>
            <div class="loading" id="loading">
                <div class="loading-spinner"></div>
                <div>正在加载播放器...</div>
            </div>
        </div>
        
        <div class="error-message" id="errorMessage"></div>
    </div>

    <!-- 播放器库本机提供（web/vendor/），DPlayer 的样式已打包在 JS 里 -->
    <script src="player-assets/DPlayer.min.js"></script>
    <script src="player-assets/hls.min.js"></script>
    <script src="player-assets/mpegts.js"></script>
    <script>
        // 从URL参数获取播放信息
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = browserPlaybackUrl(urlParams.get('url'));
        const channelName = urlParams.get('name') || '未知频道';
        let streamCleanup = () => {};
        window.addEventListener('pagehide', () => streamCleanup());
        
        // 显示频道信息
        document.getElementById('channelName').textContent = channelName;
        document.getElementById('channelUrl').textContent = videoUrl || '';
        
        // 关闭播放器
        function closePlayer() {
            window.close();
            // 如果window.close()不起作用（某些浏览器限制），则返回上一页
            setTimeout(() => {
                if (!window.closed) {
                    window.history.back();
                }
            }, 100);
        }
        
        // 显示错误信息
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            document.getElementById('loading').style.display = 'none';
        }

        // 频道入口拿不到地址时回 HTTP 200 + 一行中文原因（#131 定的兼容行为），hls.js 只会报
        // manifestParsingError。把这行原因取出来直接显示（issue #140）；开头的频道 ID 对用户没意义，去掉。
        function hlsServerReason(data) {
            const body = data && data.response && data.response.data;
            if (typeof body !== 'string') return '';
            const text = body.trim();
            if (!text || text.length > 300 || text.startsWith('#EXTM3U') || text.startsWith('<')) return '';
            return text.replace(/^\d+\s+/, '');
        }

        // 从最高档起播：主清单解析完后把起播档设成分辨率最高（同分辨率取码率最高）的那一档再开始加载，
        // 之后照常自动升降档，网速跟不上会降。hls.js 默认按测速从中低档起步，几秒后才升上来。单档清单不受影响。
        function highestLevelIndex(levels) {
            let best = -1;
            (levels || []).forEach((level, index) => {
                const pixels = (level.width || 0) * (level.height || 0);
                const top = levels[best];
                const topPixels = top ? (top.width || 0) * (top.height || 0) : -1;
                if (pixels > topPixels || (pixels === topPixels && (level.bitrate || 0) > (top.bitrate || 0))) best = index;
            });
            return best;
        }
        function startHlsAtTopLevel(hls) {
            hls.once(Hls.Events.MANIFEST_PARSED, (event, data) => {
                const index = highestLevelIndex(data.levels);
                if (index >= 0) hls.startLevel = index;
                hls.startLoad();
            });
        }
        // 与管理台内播放一致：咪咕、山东齐鲁与宁波的 CDN 不给网页跨域许可（宁波还拒绝别家来源头），由本机全代理播放。
        function browserPlaybackUrl(rawUrl, pageUrl = window.location.href) {
            try {
                const url = new URL(rawUrl, pageUrl);
                if (url.origin !== new URL(pageUrl).origin) return rawUrl;
                const match = url.pathname.match(/^(.*\/)(\d+|iqilu-[a-z0-9]{2,12}|ningbo-[a-z]{2,12})(?:\.m3u8)?$/);
                if (!match) return rawUrl;
                let prefix = match[1];
                if (prefix.endsWith('/proxy/')) return rawUrl;
                if (prefix.endsWith('/relay/')) prefix = prefix.slice(0, -6);
                if (/\/(?:proxy|relay)\//i.test(prefix)) return rawUrl;
                url.pathname = `${prefix}proxy/${match[2]}.m3u8`;
                return url.href;
            } catch { return rawUrl; }
        }

        // 初始化播放器
        function initPlayer() {
            if (!videoUrl) {
                showError('❌ 播放地址不能为空');
                return;
            }
            
            try {
                // 判断视频类型
                // 延迟解析频道的旧地址可能没有 .m3u8 后缀，但本机服务会按 HLS
                // Content-Type 直出动态清单；网页播放器也要显式走 hls.js。
                let sameOriginStream = false;
                try { sameOriginStream = new URL(videoUrl, window.location.href).origin === window.location.origin; } catch {}
                const isFlv = /\.flv(?:[?#]|$)/i.test(videoUrl);
                // 本机静态媒体（公告短片 /assets/announcement.mp4 等）不是直播流：走原生播放并放开进度条，
                // 按同源规则交给 hls.js 只会 manifestParsingError（issue #119）。
                const isDirectMedia = /\.(?:mp4|m4v|webm|mov|mp3|m4a|aac|ogg)(?:[?#]|$)/i.test(videoUrl);
                const videoType = isFlv ? 'flv' : (!isDirectMedia && (videoUrl.toLowerCase().includes('.m3u8') || sameOriginStream)) ? 'hls' : 'auto';
                
                const dp = new DPlayer({
                    container: document.getElementById('dplayer'),
                    live: !isDirectMedia,
                    autoplay: true,
                    screenshot: true,
                    hotkey: true,
                    mutex: true,
                    theme: '#667eea',
                    lang: 'zh-cn',
                    video: {
                        url: videoUrl,
                        type: videoType,
                        customType: {
                            flv: function(video) {
                                if (!mpegts.getFeatureList().mseLivePlayback) { showError('当前浏览器不支持 FLV，请使用 VLC、IINA 等播放器'); return; }
                                let engine, timer, stable, attempts = 0, closed = false;
                                const destroy = () => { clearTimeout(stable); if (engine) { const old = engine; engine = null; old.off(mpegts.Events.ERROR, retry); old.off(mpegts.Events.LOADING_COMPLETE, retry); old.destroy(); } };
                                const retry = () => {
                                    clearTimeout(stable);
                                    if (closed || timer) return;
                                    if (attempts >= 6) { destroy(); showError('直播连接失败，请检查账号配置或重新打开频道'); return; }
                                    timer = setTimeout(() => { timer = null; connect(); }, Math.min(30000, 2000 * 2 ** attempts++));
                                };
                                const connect = () => {
                                    destroy();
                                    if (closed) return;
                                    engine = mpegts.createPlayer({type:'flv', isLive:true, url:videoUrl}, {enableWorker:false, lazyLoad:false, autoCleanupSourceBuffer:true, autoCleanupMaxBackwardDuration:20, autoCleanupMinBackwardDuration:10});
                                    engine.on(mpegts.Events.ERROR, retry);
                                    engine.on(mpegts.Events.LOADING_COMPLETE, retry);
                                    engine.attachMediaElement(video); engine.load();
                                    video.play().catch(() => {});
                                };
                                const playing = () => { clearTimeout(stable); stable = setTimeout(() => { attempts = 0; }, 30000); };
                                video.addEventListener('playing', playing);
                                streamCleanup = () => { closed = true; clearTimeout(timer); destroy(); video.removeEventListener('playing', playing); };
                                connect();
                            },
                            hls: function (video, player) {
                                const hls = new Hls({
                                    enableWorker: true,
                                    lowLatencyMode: true,
                                    backBufferLength: 90,
                                    // 央视频等来源每次刷新清单会换 CDN 节点，同一分片序号的地址随之变化；
                                    // hls.js 1.6 起把这当成清单错误，只有一个清晰度时直接放弃，十几秒后
                                    // 停播（issue #142）。内容是同一路流，照常播即可，只记警告。
                                    ignorePlaylistParsingErrors: true,
                                    autoStartLoad: false
                                });
                                startHlsAtTopLevel(hls);
                                hls.loadSource(video.src);
                                hls.attachMedia(video);
                                streamCleanup = () => hls.destroy();
                                
                                hls.on(Hls.Events.ERROR, function (event, data) {
                                    // 直接 console.error(data) 在内置浏览器日志里只显示 "Object"，
                                    // 排查时完全看不到是清单、分片还是解复用失败。只打 HLS.js 的
                                    // 诊断字段，不输出可能很长/带签名的完整响应对象。
                                    console.error('HLS Error:', JSON.stringify({
                                        type: data.type,
                                        details: data.details,
                                        reason: data.reason || '',
                                        fatal: data.fatal,
                                        status: data.response && data.response.code
                                    }));
                                    const reason = data.fatal ? hlsServerReason(data) : '';
                                    if (reason) {
                                        showError('❌ 播放失败：' + reason);
                                    } else if (data.fatal) {
                                        switch(data.type) {
                                            case Hls.ErrorTypes.NETWORK_ERROR:
                                                showError('❌ 网络错误：无法加载视频流，请检查网络连接');
                                                break;
                                            case Hls.ErrorTypes.MEDIA_ERROR:
                                                showError('❌ 媒体错误：视频格式可能不支持，建议使用播放器软件打开');
                                                hls.recoverMediaError();
                                                break;
                                            default:
                                                showError('❌ 播放错误：' + data.type);
                                                break;
                                        }
                                    }
                                });
                            }
                        }
                    }
                });
                
                // 播放器加载完成
                dp.on('loadedmetadata', function () {
                    document.getElementById('loading').style.display = 'none';
                    console.log('播放器加载完成');
                });
                
                // 播放错误处理
                dp.on('error', function () {
                    showError('❌ 播放失败：该频道可能需要使用专业播放器（如VLC、PotPlayer）打开');
                });
                
            } catch (error) {
                console.error('播放器初始化失败:', error);
                showError('❌ 播放器初始化失败：' + error.message);
            }
        }
        
        // 页面加载完成后初始化播放器
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPlayer);
        } else {
            initPlayer();
        }
        
        // 键盘快捷键：ESC关闭播放器
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closePlayer();
            }
        });
    </script>
</body>
</html>
